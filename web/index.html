<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>우리의 기록 · 사회복지 바이브코딩 아카이브</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 로컬 미리보기용. 데이터를 data.js 로 임베드하며 로그인이 없다. -->
  <div class="app" id="appRoot">
    <aside class="sidebar" aria-label="주요 탐색">
      <div class="brand-lockup">
        <strong>우리의 기록</strong>
        <span class="room-title" id="roomTitle">아카이브</span>
        <small class="room-sub" id="roomSub"></small>
      </div>
      <nav class="side-nav" id="tabs">
        <p class="nav-label">둘러보기</p>
        <button class="tab active" type="button" data-view="summary" aria-current="page">주제별 지식</button>
        <button class="tab" type="button" data-view="timeline">타임라인</button>
        <button class="tab" type="button" data-view="graph">관계망</button>
        <p class="nav-label">모아보기</p>
        <button class="tab" type="button" data-view="tags">태그</button>
        <button class="tab" type="button" data-view="gallery">갤러리</button>
        <button class="tab" type="button" data-view="files">첨부파일</button>
        <button class="tab" type="button" data-view="stats">통계</button>
        <p class="nav-label">나의 공간</p>
        <button class="tab" type="button" data-view="mine">내 글 관리</button>
        <button class="tab" type="button" data-view="admin">관리자</button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-session" id="sessionBox"></div>
        <div class="sidebar-actions">
          <button class="sidebar-signout" id="signOutTop" type="button" hidden>로그아웃</button>
          <button class="font-toggle" id="fontBtn" type="button"
            aria-label="글자 크기 크게로 전환"></button>
          <button class="theme-toggle" id="themeBtn" type="button"
            aria-label="다크 모드로 전환"></button>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="utility-bar">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">아카이브 검색</span>
          <input id="searchInput" type="search" placeholder="대화·사람·주제 검색" autocomplete="off" />
        </label>
        <label class="filter">
          <span class="sr-only">참여자 필터</span>
          <select id="participantFilter"><option value="">전체 참여자</option></select>
        </label>
      </header>
      <main class="view" id="view"><p class="hint">불러오는 중…</p></main>
    </div>

    <nav class="mobile-nav" id="mobileNav" aria-label="모바일 주요 탐색">
      <button type="button" data-view="summary" aria-current="page">홈</button>
      <button type="button" data-view="timeline">타임라인</button>
      <button type="button" data-view="gallery">사진</button>
      <button type="button" data-view="mine">내 기록</button>
      <button id="mobileMoreButton" aria-label="더 많은 화면 열기" type="button"
        aria-controls="mobileMore" aria-expanded="false">더보기</button>
    </nav>
    <div class="mobile-more" id="mobileMore" hidden></div>

    <!-- 물어보기. #view 밖에 두어 글자 크기 배율을 타지 않는다(web/ask.js). -->
    <button class="ask-fab" id="askFab" type="button" aria-controls="askPanel"
      aria-expanded="false" aria-label="물어보기 열기">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"></path><path d="M9.6 9.6a2.4 2.4 0 1 1 3.4 2.2c-.6.3-1 .8-1 1.5v.3"></path><path d="M12 16.4h.01"></path></svg>
      <span class="ask-fab__label">물어보기</span>
    </button>
    <section class="ask-panel" id="askPanel" role="dialog" aria-modal="false"
      aria-labelledby="askTitle" hidden>
      <header class="ask-head">
        <div>
          <h2 id="askTitle">물어보기</h2>
          <p class="ask-sub">대화에서 나온 주제와 사이트 쓰는 법을 찾아 드려요</p>
        </div>
        <button class="ask-close" id="askClose" type="button" aria-label="물어보기 닫기">×</button>
      </header>
      <div class="ask-log" id="askLog" role="log" aria-live="polite"></div>
      <form class="ask-form" id="askForm">
        <label class="sr-only" for="askInput">궁금한 것</label>
        <input id="askInput" type="text" maxlength="120" autocomplete="off"
          placeholder="예: 한글 자동화 얘기 어디 있었지?" />
        <button class="ask-send" type="submit">묻기</button>
      </form>
    </section>
  </div>

  <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <form method="dialog">
      <p class="eyebrow">한 번 더 확인해 주세요</p>
      <h2 id="confirmTitle"></h2>
      <p id="confirmDesc"></p>
      <div class="confirm-dialog__actions">
        <button class="btn ghost" type="submit" value="cancel">취소</button>
        <button class="btn danger" id="confirmSubmit" type="submit" value="confirm">계속하기</button>
      </div>
    </form>
  </dialog>

  <div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose" type="button" aria-label="확대 이미지 닫기">×</button>
    <img id="lightboxImg" alt="" />
  </div>

  <script src="data.js"></script>
  <script src="images.js"></script>
  <script src="graph.js"></script>
  <!-- 글자·마크다운 순수 함수. app.js 가 로드 시점에 읽으므로 반드시 앞에 온다. -->
  <script src="text.js"></script>
  <script src="timeline.js"></script>
  <script src="summary.js"></script>
  <script src="graph-view.js"></script>
  <script src="tags.js"></script>
  <script src="gallery.js"></script>
  <script src="stats.js"></script>
  <script src="mine.js"></script>
  <script src="admin.js"></script>
  <script src="ask.js"></script>
  <script src="app.js"></script>
</body>
</html>
