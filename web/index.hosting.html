<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>사회복지 바이브코딩 아카이브</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 배포본: 대화 데이터를 담지 않는다. 로그인 후 Firestore 에서 받아온다. -->
  <div class="gate" id="gate">
    <div class="gate-card" id="gateBody">
      <div class="gate-spinner"></div>
      <p class="gate-desc">준비 중…</p>
    </div>
    <p class="gate-foot">구성원 전용 아카이브 · 대화 참여자만 열람할 수 있습니다</p>
  </div>

  <div class="app hidden" id="appRoot">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title-row">
          <div class="brand">
            <h1 class="room-title" id="roomTitle">아카이브</h1>
            <p class="room-sub" id="roomSub"></p>
          </div>
          <span class="session" id="sessionBox"></span>
          <button class="icon-btn" id="themeBtn" title="테마 전환">🌗</button>
        </div>
        <div class="controls">
          <label class="search">
            <span>🔍</span>
            <input id="searchInput" type="search" placeholder="본문·작성자·날짜·노드 검색" autocomplete="off" />
          </label>
          <span class="filter">
            <select id="participantFilter"><option value="">전체 참여자</option></select>
          </span>
        </div>
        <nav class="tabs" id="tabs">
          <div class="tab active" data-view="summary">주제별 지식</div>
          <div class="tab" data-view="graph">관계망</div>
          <div class="tab" data-view="timeline">타임라인</div>
          <div class="tab" data-view="gallery">갤러리</div>
          <div class="tab" data-view="stats">통계</div>
          <div class="tab" data-view="mine">내 글 관리</div>
        </nav>
      </div>
    </header>

    <main class="view" id="view"><p class="hint">불러오는 중…</p></main>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightboxClose">×</span>
    <img id="lightboxImg" alt="" />
  </div>

  <!-- Firebase SDK: Hosting 예약 URL(동일 출처)로 서빙 — 외부 CDN 아님 -->
  <script src="/__/firebase/12.16.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/12.16.0/firebase-auth-compat.js"></script>
  <script src="/__/firebase/12.16.0/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="images.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
  <script src="boot.js"></script>
</body>
</html>
