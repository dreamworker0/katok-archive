<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>사회복지 바이브코딩 아카이브</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 배포본: 대화 데이터를 담지 않는다. 로그인 후 Firestore 에서 받아온다. -->
  <div class="gate" id="gate">
    <div class="gate-card" id="gateBody">
      <div class="gate-spinner"></div>
      <p class="gate-desc">준비 중…</p>
    </div>
    <p class="gate-foot">구성원 전용 아카이브 · 대화 참여자만 열람할 수 있습니다</p>
  </div>

  <div class="app hidden" id="appRoot">
    <aside class="sidebar" aria-label="주요 탐색">
      <div class="brand-lockup">
        <strong>우리의 기록</strong>
        <span class="room-title" id="roomTitle">아카이브</span>
        <small class="room-sub" id="roomSub"></small>
      </div>
      <nav class="side-nav" id="tabs">
        <p class="nav-label">둘러보기</p>
        <button class="tab active" type="button" data-view="summary" aria-current="page">주제별 지식</button>
        <button class="tab" type="button" data-view="timeline">타임라인</button>
        <button class="tab" type="button" data-view="graph">관계망</button>
        <p class="nav-label">모아보기</p>
        <button class="tab" type="button" data-view="gallery">갤러리</button>
        <button class="tab" type="button" data-view="files">첨부파일</button>
        <button class="tab" type="button" data-view="stats">통계</button>
        <p class="nav-label">나의 공간</p>
        <button class="tab" type="button" data-view="mine">내 글 관리</button>
        <button class="tab" type="button" data-view="admin">관리자</button>
      </nav>
      <div class="sidebar-session" id="sessionBox"></div>
      <button class="theme-toggle" id="themeBtn" type="button" aria-label="다크 모드로 전환"></button>
    </aside>

    <div class="app-main">
      <header class="utility-bar">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">아카이브 검색</span>
          <input id="searchInput" type="search" placeholder="대화·사람·주제 검색" autocomplete="off" />
        </label>
        <label class="filter">
          <span class="sr-only">참여자 필터</span>
          <select id="participantFilter"><option value="">전체 참여자</option></select>
        </label>
      </header>
      <main class="view" id="view"><p class="hint">불러오는 중…</p></main>
    </div>

    <nav class="mobile-nav" id="mobileNav" aria-label="모바일 주요 탐색">
      <button type="button" data-view="summary" aria-current="page">홈</button>
      <button type="button" data-view="timeline">타임라인</button>
      <button type="button" data-view="gallery">사진</button>
      <button type="button" data-view="mine">내 기록</button>
      <button id="mobileMoreButton" aria-label="더 많은 화면 열기" type="button"
        aria-controls="mobileMore" aria-expanded="false">더보기</button>
    </nav>
    <div class="mobile-more" id="mobileMore" hidden></div>
  </div>

  <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <form method="dialog">
      <p class="eyebrow">한 번 더 확인해 주세요</p>
      <h2 id="confirmTitle"></h2>
      <p id="confirmDesc"></p>
      <div class="confirm-dialog__actions">
        <button class="btn ghost" type="submit" value="cancel">취소</button>
        <button class="btn danger" id="confirmSubmit" type="submit" value="confirm">계속하기</button>
      </div>
    </form>
  </dialog>

  <div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose" type="button" aria-label="확대 이미지 닫기">×</button>
    <img id="lightboxImg" alt="" />
  </div>

  <!-- Firebase SDK: Hosting 예약 URL(동일 출처)로 서빙 — 외부 CDN 아님 -->
  <script src="/__/firebase/12.16.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/12.16.0/firebase-auth-compat.js"></script>
  <script src="/__/firebase/12.16.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/12.16.0/firebase-functions-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="images.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
  <script src="boot.js"></script>
</body>
</html>
