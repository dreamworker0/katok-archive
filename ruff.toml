# 파이썬 린트. 잡는 것은 '틀린 코드' 다 — 문법 오류, 정의 안 된 이름, 안 쓰는 import,
# 잘못된 이스케이프. 스타일(줄 길이·따옴표·정렬)은 보지 않는다. 이 저장소의 값은
# "왜 이렇게 했는가" 를 적은 주석에 있고, 스타일 규칙은 그 주석을 다시 접게 만든다.
#
# 처음 돌린 날(2026-09-02) 기준 15건이 걸렸고 전부 안 쓰는 import·변수였다.
# 규칙을 넓히려면 먼저 `python -m ruff check --select <규칙> scripts tests` 로
# 몇 건인지 본 뒤 한 번에 고치고 넣는다 — 걸리는 채로 넣으면 CI 가 빨간불에 익숙해진다.
target-version = "py313"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "W"]
# E741: l·O·I 한 글자 이름. 스무 군데가 `for l in lines` 꼴의 짧은 루프 변수라 뜻이
# 분명하다. 이름을 전부 바꾸면 diff 가 그것으로만 가득 차서 실제 변경이 안 보인다.
ignore = ["E741"]
